[project]
name = "ynab-cli"
version = "0.1.0"
description = "Comprehensive Python CLI for YNAB API - designed for programmatic use by Claude Code and automation"
readme = "README.md"
authors = [
    { name = "Donald Schartman", email = "schartmand@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "typer>=0.21.1",
]

[project.urls]
Homepage = "https://github.com/dschartman/ynab-cli"
Repository = "https://github.com/dschartman/ynab-cli"
Issues = "https://github.com/dschartman/ynab-cli/issues"

[project.scripts]
ynab = "ynab_cli.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_cli"]
